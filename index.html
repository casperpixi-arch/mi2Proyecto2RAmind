<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Realidad aumentada</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    /* No colocar fondo negro ni modificar el z-index del video */

    #mensaje {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      width: calc(100% - 30px);
      max-width: 500px;
      padding: 10px;
      box-sizing: border-box;

      color: white;
      background-color: rgba(0, 0, 0, 0.65);
      border-radius: 10px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 16px;

      pointer-events: none;
    }

    #estado {
      display: block;
      margin-top: 5px;
      color: #62ff89;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="mensaje">
    Apunta la cámara hacia la imagen objetivo
    <span id="estado">Iniciando cámara...</span>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./objetivo.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets timeout="30000">
      <a-asset-item
        id="modelo3d"
        src="./modelo.glb"
      ></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-light
      type="ambient"
      color="#ffffff"
      intensity="2"
    ></a-light>

    <a-light
      type="directional"
      color="#ffffff"
      intensity="1"
      position="1 2 3"
    ></a-light>

    <a-entity
      id="objetivoAR"
      mindar-image-target="targetIndex: 0"
    >
      <a-gltf-model
        id="modeloVisible"
        src="#modelo3d"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
      ></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const escena = document.querySelector("a-scene");
      const objetivo = document.querySelector("#objetivoAR");
      const modelo = document.querySelector("#modeloVisible");
      const estado = document.querySelector("#estado");

      escena.addEventListener("arReady", function () {
        estado.textContent =
          "Cámara lista. Busca la imagen objetivo.";
      });

      escena.addEventListener("arError", function (error) {
        estado.textContent =
          "No se pudo iniciar la cámara. Revisa los permisos.";

        console.error("Error de cámara:", error);
      });

      objetivo.addEventListener("targetFound", function () {
        estado.textContent =
          "Imagen detectada. Modelo 3D visible.";
      });

      objetivo.addEventListener("targetLost", function () {
        estado.textContent =
          "Imagen perdida. Apunta nuevamente.";
      });

      modelo.addEventListener("model-loaded", function () {
        console.log("El modelo GLB se cargó correctamente.");
      });

      modelo.addEventListener("model-error", function (error) {
        estado.textContent =
          "Error al cargar modelo.glb.";

        console.error("Error del modelo:", error);
      });
    });
  </script>

</body>
</html>
