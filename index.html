<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>Realidad aumentada 3D</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR para A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: calc(100% - 40px);
      max-width: 500px;
      box-sizing: border-box;
      padding: 12px 16px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      pointer-events: none;
    }

    #estado {
      display: block;
      margin-top: 4px;
      color: #73ff9a;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="mensaje">
    Apunta la cámara hacia la imagen objetivo
    <span id="estado">Cargando realidad aumentada...</span>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./objetivo.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      missTolerance: 5;
      warmupTolerance: 5;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <!-- Archivos utilizados en la escena -->
    <a-assets timeout="30000">
      <a-asset-item
        id="modelo3d"
        src="./modelo.glb"
        response-type="arraybuffer"
      ></a-asset-item>
    </a-assets>

    <!-- Cámara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="far: 10000; objects: .clickable;"
    ></a-camera>

    <!-- Iluminación -->
    <a-light
      type="ambient"
      color="#ffffff"
      intensity="1.5"
    ></a-light>

    <a-light
      type="directional"
      color="#ffffff"
      intensity="1"
      position="1 2 3"
    ></a-light>

    <!-- Imagen objetivo número 0 -->
    <a-entity
      id="objetivoAR"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Contenedor para ajustar el modelo -->
      <a-entity
        id="contenedorModelo"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
      >

        <a-gltf-model
          src="#modelo3d"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1"
          animation-mixer
        ></a-gltf-model>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const scene = document.querySelector("a-scene");
      const objetivo = document.querySelector("#objetivoAR");
      const estado = document.querySelector("#estado");

      scene.addEventListener("arReady", function () {
        estado.textContent = "Cámara lista. Busca la imagen objetivo.";
      });

      scene.addEventListener("arError", function (evento) {
        estado.textContent =
          "No se pudo iniciar la cámara. Revisa los permisos.";
        console.error("Error de realidad aumentada:", evento);
      });

      objetivo.addEventListener("targetFound", function () {
        estado.textContent = "Imagen detectada. Modelo 3D visible.";
      });

      objetivo.addEventListener("targetLost", function () {
        estado.textContent = "Imagen perdida. Vuelve a apuntar hacia ella.";
      });
    });
  </script>

</body>
</html>
