
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Prueba de realidad aumentada</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      width: calc(100% - 30px);
      max-width: 500px;
      padding: 12px;
      box-sizing: border-box;

      color: white;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      text-align: center;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }

    #estado {
      display: block;
      margin-top: 5px;
      color: #70ff90;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="mensaje">
    Apunta hacia la imagen objetivo
    <span id="estado">Iniciando cámara...</span>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./objetivo.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="30000">
      <a-asset-item
        id="modelo3d"
        src="./modelo.glb"
      ></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="objetivoAR"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Cubo rojo para comprobar que reconoce el objetivo -->
      <a-box
        position="0 0 0.25"
        rotation="0 45 0"
        scale="0.4 0.4 0.4"
        color="#ff0000"
        animation="
          property: rotation;
          to: 0 405 0;
          loop: true;
          dur: 4000;
          easing: linear;
        "
      ></a-box>

      <!-- Modelo GLB -->
      <a-gltf-model
        id="modeloVisible"
        src="#modelo3d"
        position="0 0 0.15"
        rotation="0 0 0"
        scale="0.1 0.1 0.1"
        visible="false"
      ></a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const escena = document.querySelector("a-scene");
      const objetivo = document.querySelector("#objetivoAR");
      const modelo = document.querySelector("#modeloVisible");
      const estado = document.querySelector("#estado");

      escena.addEventListener("arReady", function () {
        estado.textContent =
          "Cámara lista. Buscando la imagen objetivo...";
      });

      escena.addEventListener("arError", function (error) {
        estado.textContent =
          "Error al iniciar la cámara.";

        console.error("Error de cámara:", error);
      });

      objetivo.addEventListener("targetFound", function () {
        estado.textContent =
          "Objetivo detectado. Debe aparecer el cubo rojo.";
      });

      objetivo.addEventListener("targetLost", function () {
        estado.textContent =
          "Objetivo perdido. Vuelve a apuntar hacia la imagen.";
      });

      modelo.addEventListener("model-loaded", function () {
        console.log("El modelo GLB se cargó correctamente.");
      });

      modelo.addEventListener("model-error", function (error) {
        estado.textContent =
          "El objetivo funciona, pero modelo.glb tiene un error.";

        console.error("Error al cargar modelo.glb:", error);
      });
    });
  </script>

</body>
</html>
